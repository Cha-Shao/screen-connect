[package]
name = "screen-connect"
version = "1.0.0"
description = "ScreenConnect 桌面端：WebRTC 语音聊天 + 屏幕共享"
edition = "2021"

[lib]
name = "screen_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
