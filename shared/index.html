<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScreenConnect · 语音聊天 + 屏幕共享</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 加载动画：在 JS 加载前就显示 -->
  <div id="splash">
    <div class="splash-spinner"></div>
    <div class="splash-title">ScreenConnect</div>
    <div class="splash-sub">加载中…</div>
  </div>

  <div id="app" class="hidden">
    <!-- ===== 未连接：登录卡片 ===== -->
    <section id="lobby" class="card bg-base-200 shadow-2xl">
      <h1>ScreenConnect</h1>
      <p class="sub">连接服务器，选择房间加入 · 语音通话 + 屏幕共享（1080p / 60fps）</p>

      <label>信令服务器（域名:端口）
        <div class="host-row">
          <input id="serverHost" type="text" class="input input-bordered w-full" placeholder="公网IP或域名（默认端口1454）" value="localhost:1454" autocomplete="off" />
          <label class="wss-toggle" title="服务器若套了 TLS/反代则勾选">
            <input id="wssCheck" type="checkbox" class="checkbox checkbox-xs" /> wss
          </label>
        </div>
      </label>

      <label>昵称
        <input id="nickInput" type="text" class="input input-bordered w-full" maxlength="24" placeholder="给自己起个名字" autocomplete="off" />
      </label>

      <div class="machine">
        <span class="lbl">机器码（你的唯一 ID）</span>
        <code id="machineId">读取中…</code>
        <button id="copyIdBtn" class="btn btn-xs btn-ghost" title="复制">复制</button>
      </div>

      <button id="connectBtn" class="btn btn-primary w-full">连接服务器</button>
      <p id="lobbyMsg" class="msg"></p>
    </section>

    <!-- ===== 已连接：持久侧栏 + 主区域 ===== -->
    <section id="main" class="hidden">
      <header class="topbar">
        <div class="roominfo">
          <span class="dot live"></span>
          <span id="currentRoom">未加入房间</span>
        </div>
        <span id="onlineCount" class="online-cnt">0 人在线</span>
        <button id="quitBtn" class="btn btn-warning btn-sm hidden">退出房间</button>
        <button id="leaveBtn" class="btn btn-error btn-sm">断开</button>
      </header>

      <div id="body">
        <!-- 左：持久侧栏 -->
        <aside id="sidebar">
          <div class="sb-section">
            <div class="sb-head"><span>房间列表</span></div>
            <div id="roomList" class="room-list"></div>
          </div>
          <div class="sb-section">
            <div class="sb-head"><span>大厅（未进房间）</span></div>
            <div id="lobbyUsers" class="lobby-users"></div>
            <div id="lobbyEmpty" class="lobby-empty">暂无</div>
          </div>
        </aside>

        <!-- 右：主区域 -->
        <div id="stage">
          <!-- 未在房间 -->
          <div id="noRoom" class="no-room">
            <div class="no-room-ico">🏠</div>
            <div>从左侧选择一个房间加入</div>
            <div class="no-room-sub">点击房间名即可进入，也可将大厅里的人拖到房间中</div>
          </div>
          <!-- 在房间内 -->
          <div id="inRoom" class="hidden">
            <div id="pinGrid" class="pin-grid hidden"></div>
            <div id="selfTile" class="self-tile">
              <video id="selfVideo" autoplay playsinline muted></video>
              <div class="self-empty" id="selfEmpty">
                <div class="self-empty-ico">🖥</div>
                <div>你尚未共享屏幕</div>
                <div class="self-empty-sub">点击下方"共享屏幕"即可开始</div>
              </div>
              <div class="sc-badge"><span id="selfName">我</span><span class="tag self-tag">本机</span></div>
            </div>
            <div id="pinHint" class="pin-hint hidden">已固定 <b id="pinCount">0</b> 个画面 · 在右侧点"⤢"可固定/取消</div>
          </div>
        </div>

        <!-- 右侧成员栏（房间内） -->
        <aside id="peerBar" class="hidden">
          <div class="pb-head">
            <span>房间成员</span>
            <span id="shareCount" class="sb-cnt hidden">0 共享中</span>
          </div>
          <div id="peerGrid" class="peer-grid"></div>
          <div id="peerEmpty" class="peer-empty">房间里还没有其他人</div>
        </aside>
      </div>

      <footer id="controls" class="controls hidden">
        <div class="mic-select">
          <span class="ico">🎙</span>
          <select id="micDevice" class="select select-bordered select-sm" title="选择麦克风设备"></select>
        </div>
        <button id="micBtn" class="ctl btn btn-sm btn-success" title="麦克风">
      <span class="ico">🎙</span><span class="t">麦克风开</span>
    </button>
    <div class="noise-select">
      <button id="noiseBtn" class="ctl btn btn-sm btn-ghost" title="降噪设置">
        <span class="ico">🌊</span><span class="t">降噪</span>
      </button>
      <div id="noiseDropdown" class="noise-dropdown hidden">
        <div class="noise-opt" data-mode="none">无降噪</div>
        <div class="noise-opt" data-mode="rnnoise">RNNoise（推荐）</div>
        <div class="noise-opt" data-mode="webrtc">WebRTC ANS</div>
      </div>
    </div>
    <button id="shareBtn" class="ctl btn btn-sm" title="共享屏幕">
          <span class="ico">🖥</span><span class="t">共享屏幕</span>
        </button>
        <div class="qual-set">
    <select id="resolutionSelect" class="select select-bordered select-sm" title="共享分辨率">
      <option value="720">720p</option>
      <option value="1080" selected>1080p</option>
    </select>
    <select id="framerateSelect" class="select select-bordered select-sm" title="共享帧率">
      <option value="30">30fps</option>
      <option value="60" selected>60fps</option>
    </select>
  </div>
      </footer>
    </section>

    <!-- ===== 模态弹窗 ===== -->
    <div id="modal" class="sc-modal hidden">
      <div class="sc-modal-backdrop"></div>
      <div class="sc-modal-box">
        <div id="modalIcon" class="sc-modal-icon"></div>
        <div id="modalTitle" class="sc-modal-title"></div>
        <div id="modalBody" class="sc-modal-body"></div>
        <div id="modalActions" class="sc-modal-actions"></div>
      </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="sc-toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
